[project]
name = "contextforge"
version = "0.1.0"
description = "ContextForge: An agentic RAG system powered by CrewAI with local Qdrant vector storage, hybrid retrieval, cross-encoder reranking, and web search fallback"
authors = [{ name = "Muhammad Shahrukh Khan" }]
readme = "README.md"
requires-python = ">=3.10,<=3.13"
dependencies = [
    "crewai[tools]>=0.86.0,<1.0.0",
    "streamlit>=1.38.0",
    "markitdown>=0.0.1a4",
    "chonkie[semantic]>=0.4.0",
    "qdrant-client>=1.11.0",
    "fastembed>=0.3.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
contextforge = "agentic_rag.main:run"
contextforge-train = "agentic_rag.main:train"
contextforge-replay = "agentic_rag.main:replay"
contextforge-test = "agentic_rag.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_rag"]
